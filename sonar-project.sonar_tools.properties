# Second project on the SAME SonarQube instance (multi-project demo, Person 5).
# Analyses our own tooling package, which is written to pass a strict gate:
#   sonar-scanner -Dproject.settings=sonar-project.sonar_tools.properties
sonar.projectKey=sonar-tools-eval
sonar.projectName=sonar_tools (SonarQube evaluation)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src/sonar_tools
sonar.tests=tests
sonar.test.inclusions=tests/test_tools_*.py,tests/test_live_*.py,tests/conftest.py,tests/fake_sonar.py
sonar.python.version=3.13
sonar.python.coverage.reportPaths=reports/coverage_tools.xml
sonar.python.xunit.reportPath=reports/junit.xml
