# ---------------------------------------------------------------------------
# Analysis of the SUBJECT application (src/shopflow + polyglot fixtures).
# Host URL and token are NOT stored here: pass SONAR_HOST_URL / SONAR_TOKEN
# as environment variables (or -Dsonar.host.url / -Dsonar.token).
# ---------------------------------------------------------------------------
sonar.projectKey=shopflow-eval
sonar.projectName=ShopFlow (SonarQube evaluation)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# What is analysed -----------------------------------------------------------
sonar.sources=src/shopflow,fixtures
sonar.tests=tests
sonar.test.inclusions=tests/test_app_*.py
# Analysis scope demo: this folder must produce NO issues in SonarQube.
sonar.exclusions=src/shopflow/generated/**

# Python ----------------------------------------------------------------------
sonar.python.version=3.13
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Java fixture (Main.java is not compiled; analysis is less precise without bytecode)
sonar.java.binaries=fixtures/polyglot

# Optional scope controls to experiment with (uncomment one at a time):
# sonar.coverage.exclusions=src/shopflow/legacy.py
# sonar.cpd.exclusions=src/shopflow/exporters/**
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1481
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/legacy.py

# CI: make the scanner wait for the quality gate and fail the build when it fails
# (the pipelines in ci/ pass -Dsonar.qualitygate.wait=true).
sonar.qualitygate.timeout=300
