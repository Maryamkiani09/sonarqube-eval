# SonarQube Community Build + PostgreSQL (the supported setup).
#
#   docker compose up -d                       # start server  -> http://localhost:9000  (admin / admin, change on first login)
#   docker compose --profile scan run --rm scanner   # optional: run the scanner in a container
#
# Linux hosts need:  sudo sysctl -w vm.max_map_count=524288   (and fs.file-max=131072)
# Docker Desktop on Windows/macOS: give Docker at least 4 GB RAM.
# Image tag: check Docker Hub for the current "sonarqube" Community tags if "community" ever changes.
services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions   # drop community plugin .jar files here
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  scanner:
    profiles: ["scan"]
    image: sonarsource/sonar-scanner-cli
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - ./:/usr/src

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
